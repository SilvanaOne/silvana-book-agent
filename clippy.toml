# Calls that can panic, abort or race in ways the deny gates cannot see.
# Use the agent_logic clock, sync and num helpers instead.
disallowed-methods = [
  { path = "chrono::Utc::now", reason = "panics if the clock is before 1970; use agent_logic::clock::now_utc" },
  { path = "uuid::Uuid::now_v7", reason = "panics if the random source fails; use agent_logic::clock::uuid_v7" },
  { path = "uuid::Uuid::new_v4", reason = "panics if the random source fails; use agent_logic::clock::uuid_v7", allow-invalid = true },
  { path = "tokio::task::block_in_place", reason = "panics on a current-thread runtime; await instead", allow-invalid = true },
  { path = "tokio::runtime::Handle::current", reason = "panics outside a runtime; use Handle::try_current" },
  { path = "tokio::task::spawn", reason = "panics outside a runtime; use Handle::try_current or agent_logic::supervise::try_spawn", allow-invalid = true },
  { path = "tracing_subscriber::util::SubscriberInitExt::init", reason = "panics if a subscriber is set; use try_init" },
  { path = "tracing_appender::rolling::daily", reason = "panics on an unusable directory; use RollingFileAppender::builder" },
  { path = "tracing_appender::rolling::hourly", reason = "panics on an unusable directory; use RollingFileAppender::builder" },
  { path = "tracing_appender::rolling::minutely", reason = "panics on an unusable directory; use RollingFileAppender::builder" },
  { path = "tracing_appender::rolling::never", reason = "panics on an unusable directory; use RollingFileAppender::builder" },
  { path = "tracing_appender::non_blocking", reason = "panics if the writer thread cannot start; startup only" },
  { path = "tokio::sync::Semaphore::new", reason = "panics above MAX_PERMITS; use agent_logic::sync::semaphore" },
  { path = "rand::thread_rng", reason = "panics if the random source fails; use agent_logic::clock::jitter_ms or try_fill_bytes" },
  { path = "rand_core::RngCore::fill_bytes", reason = "panics if the random source fails; use try_fill_bytes" },
  { path = "ed25519_dalek::SigningKey::generate", reason = "panics if the random source fails; fill a seed with try_fill_bytes" },
  { path = "ecdsa::SigningKey::random", reason = "panics if the random source fails; fill a seed with try_fill_bytes" },
  { path = "core::iter::Iterator::sum", reason = "panics on overflow; use agent_logic::num::dec_sum or a checked fold" },
  { path = "core::iter::Iterator::product", reason = "panics on overflow; use a checked fold" },
  { path = "std::time::Duration::from_secs_f64", reason = "panics on negative, NaN or huge input; use try_from_secs_f64" },
  { path = "std::time::Duration::mul_f64", reason = "panics on negative, NaN or huge input; use checked integer math" },
  { path = "std::time::Duration::div_f64", reason = "panics on negative, NaN or huge input; use checked integer math" },
  { path = "std::thread::spawn", reason = "panics if the thread cannot start; use std::thread::Builder::spawn" },
  { path = "std::env::set_var", reason = "unsound once other threads run; set before the runtime starts" },
  { path = "std::env::remove_var", reason = "unsound once other threads run; remove before the runtime starts" },
  { path = "slice::split_at", reason = "panics when out of range; use split_at_checked" },
  { path = "slice::copy_from_slice", reason = "panics on a length mismatch; use try_into or a zip" },
  # Deprecated in newer Rust and its replacement is unstable on 1.88: write the compare_exchange_weak loop.
  { path = "std::sync::atomic::AtomicBool::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicU8::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicU16::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicU32::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicU64::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicUsize::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicI8::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicI16::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicI32::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicI64::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicIsize::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
  { path = "std::sync::atomic::AtomicPtr::fetch_update", reason = "deprecated (renamed try_update); use a compare_exchange_weak loop", allow-invalid = true },
]
