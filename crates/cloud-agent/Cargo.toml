[package]
name = "cloud-agent"
version.workspace = true
edition.workspace = true

[dependencies]
# Shared logic
agent-logic = { path = "../agent-logic" }
atomic-quote = { path = "../atomic-quote" }
orderbook-proto = { path = "../orderbook-proto" }
tx-verifier = { path = "../tx-verifier" }
message-signing = { path = "../message-signing" }
agent-control = { path = "../agent-control", features = ["facts"] }
agent-controller = { path = "../agent-controller" }

# gRPC
tonic = { workspace = true, features = ["tls-webpki-roots"] }
tokio-stream = "0.1"

# Async runtime
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time", "sync", "io-util", "io-std"] }

# Configuration
clap = { workspace = true, features = ["derive", "env"] }
dotenvy.workspace = true

# Logging and errors
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
anyhow.workspace = true
async-trait = "0.1"

# Crypto (for signing transaction hashes)
base64.workspace = true
ed25519-dalek = { workspace = true }
rand.workspace = true
sha2.workspace = true
bs58 = "0.5"

# Utilities
chrono.workspace = true
hex = "0.4"
rust_decimal = { version = "1.36", features = ["serde"] }
rustls = { version = "0.23", features = ["aws-lc-rs"], default-features = false }
serde_json.workspace = true
prost.workspace = true
prost-types.workspace = true
uuid = { version = "1", features = ["v7"] }
once_cell = "1"
csv = "1"

# The `usdcx` bridge commands (feature `usdcx`): Ethereum client, Circle's
# xReserve API and the local state files.
alloy = { version = ">=1.0.41, <1.8", default-features = false, features = ["std", "reqwest", "reqwest-rustls-tls", "contract", "provider-http", "rpc-types", "network", "signer-local"], optional = true }
# alloy 1.8 moved the provider and transport to reqwest 0.13: keep one reqwest (0.12).
alloy-provider = { version = ">=1.0.41, <1.8", default-features = false, optional = true }
alloy-transport-http = { version = ">=1.0.41, <1.8", default-features = false, optional = true }
alloy-primitives = { version = "1.4.1", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
serde = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[features]
# `usdcx` commands: move USDC between Ethereum and Canton (enabled by the cli).
usdcx = ["dep:alloy", "dep:alloy-provider", "dep:alloy-transport-http", "dep:alloy-primitives", "dep:reqwest", "dep:serde", "dep:zeroize"]

[dev-dependencies]
# `test-util` (not part of tokio's "full") gives tests a pausable clock, so the
# DvpProposal GC gate's 15-minute timeout is reachable without waiting for it.
tokio = { workspace = true, features = ["test-util"] }
# Prepared-transaction fixtures and deterministic control logs.
prost = { workspace = true }
agent-logic = { path = "../agent-logic", features = ["testkit"] }
agent-controller = { path = "../agent-controller", features = ["testkit"] }
